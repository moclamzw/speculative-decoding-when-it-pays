[project]
name = "speculative-decoding-when-it-pays"
version = "0.1.0"
description = "Draft-model speculative decoding with measured acceptance rates, and the honest headline: the regimes where it loses."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
